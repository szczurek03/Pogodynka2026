App\Entity\Place:
    properties:
        Locality:
            - NotBlank:
                  groups: [create,edit]
        Country:
            - NotBlank:
                  groups: [create,edit]
        latitude:
            - Range:
                  min: -90
                  max: 90
                  groups: [create, edit]
        longitude:
            - Range:
                  min: -180
                  max: 180
                  groups: [create, edit]


App\Entity\Measurement:
    properties:
        date:
            - NotBlank:
                  groups: [create, edit]
        temperature:
            - Range:
                  min: -100
                  max: 100
                  groups: [create, edit]

        humidity:
            -   Range:
                    min: 0
                    max: 100
                    groups: [ create, edit ]
